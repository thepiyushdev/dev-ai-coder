<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NexusCode AI | Developer Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #030712; }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    pre { background: #070d1a !important; padding: 1rem; border-radius: 0.75rem; border: 1px solid #1e3a8a; overflow-x: auto; margin: 0.75rem 0; }
    code { font-family: ui-monospace, Menlo, Monaco, Consolas, monospace; font-size: 0.85rem; color: #38bdf8; }
    details > summary { list-style: none; }
    details > summary::-webkit-details-marker { display: none; }
  </style>
</head>
<body class="text-slate-100 flex h-[100dvh] overflow-hidden antialiased bg-[#030712]">

  <div id="backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden backdrop-blur-sm"></div>

  <!-- Sidebar -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-72 sm:w-80 bg-[#050914] border-r border-slate-800/80 flex flex-col transition-transform duration-300 -translate-x-full md:translate-x-0 md:static">
    
    <div class="p-4 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-sky-500/10 border border-sky-400 flex items-center justify-center text-sky-400">
          <i class="fas fa-brain text-sm"></i>
        </div>
        <div>
          <span class="font-bold text-white text-sm">NexusCode</span>
          <span class="text-[10px] block text-sky-400 font-mono">Gemini AI Studio</span>
        </div>
      </div>
      <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-white p-1">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="p-3 space-y-2">
      <button onclick="createNewChat()" class="w-full py-2.5 px-4 rounded-xl bg-sky-500/15 hover:bg-sky-500/25 border border-sky-500/30 text-sky-300 font-medium text-xs flex items-center justify-center gap-2 transition active:scale-95">
        <i class="fas fa-plus"></i> New Coding Chat
      </button>

      <div class="relative">
        <i class="fas fa-search absolute left-3 top-2.5 text-xs text-slate-500"></i>
        <input type="text" id="search-input" oninput="filterChats()" placeholder="Search chats..." class="w-full pl-8 pr-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-200 placeholder-slate-500 outline-none focus:border-sky-500/50">
      </div>
    </div>

    <div class="px-4 pt-2 text-[10px] uppercase font-bold text-slate-500 tracking-wider">Recent Sessions</div>
    <div class="flex-1 overflow-y-auto px-3 py-1 space-y-1 scrollbar-thin" id="history-list"></div>

    <div class="p-3 border-t border-slate-800/80 bg-slate-950/60" id="user-profile-dock"></div>
  </aside>

  <!-- Workspace -->
  <main class="flex-1 flex flex-col h-[100dvh] bg-[#02050e] relative overflow-hidden">
    <header class="h-14 border-b border-slate-800 flex items-center justify-between px-4 bg-slate-950/60 backdrop-blur-md z-20">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-sky-400 p-1.5 rounded-lg border border-slate-800">
          <i class="fas fa-bars text-sm"></i>
        </button>
        <h2 id="current-chat-title" class="text-xs sm:text-sm font-semibold text-slate-200 truncate max-w-[200px] sm:max-w-md">New Session</h2>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openPersonalizeModal()" title="Personalize AI" class="text-xs text-slate-400 hover:text-sky-400 p-1.5 rounded-lg border border-slate-800">
          <i class="fas fa-sliders-h"></i>
        </button>
        <button onclick="clearCurrentChat()" class="text-xs text-slate-400 hover:text-red-400 transition px-2.5 py-1 rounded-lg border border-slate-800">
          <i class="fas fa-trash-alt mr-1"></i> Clear
        </button>
      </div>
    </header>

    <div id="messages-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-5 scrollbar-thin">
      <div id="welcome-state" class="h-full flex flex-col items-center justify-center text-center space-y-4 max-w-md mx-auto my-auto py-12">
        <div class="w-14 h-14 rounded-2xl bg-sky-500/10 border border-sky-400/30 flex items-center justify-center text-sky-400 text-2xl">
          <i class="fas fa-code"></i>
        </div>
        <h3 class="text-lg sm:text-xl font-bold text-white">NexusCode AI Coding Architect</h3>
        <p class="text-xs sm:text-sm text-slate-400">
          Ask full projects, games, web apps, backend logic, or bug fixes with syntax highlighting.
        </p>
      </div>
    </div>

    <!-- Bottom Input Deck -->
    <footer class="p-3 sm:p-4 bg-[#050914] border-t border-slate-800 z-20">
      <div class="max-w-4xl mx-auto space-y-2">
        <div id="image-preview-container" class="hidden flex items-center gap-2 bg-slate-900 border border-sky-500/30 p-2 rounded-xl w-max">
          <img id="image-preview" src="" alt="preview" class="h-10 w-10 object-cover rounded-lg border border-slate-700">
          <span id="image-name" class="text-xs text-sky-300 max-w-[150px] truncate"></span>
          <button onclick="removeAttachedImage()" class="text-slate-400 hover:text-red-400 p-1"><i class="fas fa-times text-xs"></i></button>
        </div>

        <div class="flex items-end gap-2 bg-slate-900/80 border border-slate-800 rounded-2xl p-1.5 focus-within:border-sky-500/70 transition">
          <label class="cursor-pointer p-2.5 text-slate-400 hover:text-sky-400 transition rounded-xl hover:bg-slate-800/80 flex items-center justify-center">
            <i class="fas fa-image text-sm"></i>
            <input type="file" id="media-input" accept="image/*" class="hidden" onchange="handleImageSelection(event)">
          </label>

          <textarea id="prompt-input" rows="1" placeholder="Describe coding task or paste code..." class="flex-1 bg-transparent text-sm text-slate-100 placeholder-slate-500 resize-none outline-none py-2.5 max-h-32 scrollbar-thin"></textarea>

          <button id="send-btn" type="button" onclick="sendMessage()" class="p-2.5 px-3.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-xl transition shadow-lg shadow-sky-500/20 active:scale-95 flex items-center justify-center">
            <i id="send-icon" class="fas fa-arrow-up text-xs"></i>
          </button>
        </div>
      </div>
    </footer>
  </main>

  <!-- Universal Auth Modal -->
  <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-[#0b1324] border border-slate-800 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-sky-500/20 text-sky-400 flex items-center justify-center">
            <i class="fas fa-user-lock text-xs"></i>
          </div>
          <h3 id="auth-title" class="text-sm font-bold text-white">Sign In to NexusCode</h3>
        </div>
        <button onclick="closeAuthModal()" class="text-slate-400 hover:text-white p-1">
          <i class="fas fa-times text-xs"></i>
        </button>
      </div>

      <button onclick="loginWithOAuth('github')" class="w-full py-2.5 px-4 rounded-xl bg-slate-900 border border-slate-700 hover:border-sky-400 text-white font-medium text-xs flex items-center justify-center gap-3 transition">
        <i class="fab fa-github text-sm"></i> Continue with GitHub
      </button>

      <div class="flex items-center my-2">
        <div class="flex-1 border-t border-slate-800"></div>
        <span class="px-2.5 text-[10px] text-slate-500 uppercase tracking-widest font-mono">OR</span>
        <div class="flex-1 border-t border-slate-800"></div>
      </div>

      <div class="flex rounded-lg bg-slate-950 p-1 border border-slate-800 text-xs">
        <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-1.5 rounded-md font-semibold text-sky-400 bg-slate-800/80 transition">Sign In</button>
        <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition">Register</button>
      </div>

      <form id="email-auth-form" onsubmit="handleEmailAuth(event)" class="space-y-3 text-xs">
        <div id="name-field-group" class="hidden">
          <label class="text-slate-300 font-semibold block mb-1">Your Full Name</label>
          <input type="text" id="auth-name" placeholder="e.g. Piyush Sharma" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-white outline-none focus:border-sky-400">
        </div>

        <div>
          <label class="text-slate-300 font-semibold block mb-1">Email Address</label>
          <input type="email" id="auth-email" required placeholder="you@example.com" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-white outline-none focus:border-sky-400">
        </div>

        <div>
          <label class="text-slate-300 font-semibold block mb-1">Password</label>
          <input type="password" id="auth-password" required minlength="6" placeholder="••••••••" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-white outline-none focus:border-sky-400">
        </div>

        <div id="auth-error-msg" class="hidden text-[11px] text-red-400 bg-red-500/10 p-2 rounded-lg border border-red-500/20"></div>

        <button type="submit" id="auth-submit-btn" class="w-full py-2.5 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold rounded-xl text-xs transition shadow-lg shadow-sky-500/20 active:scale-95">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <!-- Onboarding & Personalize Profile Modal -->
  <div id="personalize-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center hidden p-4">
    <div class="bg-[#0b1324] border border-sky-500/40 rounded-2xl max-w-md w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto scrollbar-thin shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-xl bg-sky-500/20 text-sky-400 flex items-center justify-center">
            <i class="fas fa-sliders-h text-sm"></i>
          </div>
          <div>
            <h3 class="text-sm font-bold text-white">Personalize Your AI</h3>
            <p class="text-[10px] text-slate-400">Customize how Gemini answers your code</p>
          </div>
        </div>
        <button onclick="closePersonalizeModal()" class="text-slate-400 hover:text-white p-1">
          <i class="fas fa-times text-xs"></i>
        </button>
      </div>

      <div class="space-y-3.5 text-xs">
        <div>
          <label class="text-slate-300 font-semibold block mb-1">Your Name / Handle</label>
          <input type="text" id="user-display-name" placeholder="Enter your name" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-white outline-none focus:border-sky-400">
        </div>

        <div>
          <label class="text-slate-300 font-semibold block mb-1">Primary Tech Stack & Frameworks</label>
          <input type="text" id="user-tech-stack" placeholder="e.g. HTML, CSS, JavaScript, React, Python" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-white outline-none focus:border-sky-400">
        </div>

        <div>
          <label class="text-slate-300 font-semibold block mb-1">Custom Personalization Instructions</label>
          <textarea id="user-custom-instructions" rows="3" placeholder="e.g. Always write complete, production-ready code with HTML, CSS, JS separate or inside complete single-file blocks without skipping code." class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-white outline-none focus:border-sky-400 resize-none"></textarea>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
        <button onclick="closePersonalizeModal()" class="px-4 py-2 text-slate-400 hover:text-white text-xs">Cancel</button>
        <button onclick="saveUserProfile()" class="px-5 py-2 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs rounded-lg transition shadow-lg">Save & Apply</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
    <div class="bg-[#0b1324] border border-slate-800 rounded-2xl max-w-md w-full p-5 space-y-4 max-h-[90vh] overflow-y-auto scrollbar-thin">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i class="fas fa-cog text-sky-400"></i> Settings & Engine
        </h3>
        <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-white p-1">
          <i class="fas fa-times text-xs"></i>
        </button>
      </div>

      <div class="space-y-4 text-xs">
        <div class="space-y-1.5">
          <label class="text-slate-300 font-semibold flex items-center justify-between">
            <span><i class="fas fa-key text-sky-400 mr-1"></i> Gemini API Key</span>
            <span id="modal-key-status" class="text-[10px] text-emerald-400">Connected</span>
          </label>
          <input type="password" id="settings-key-input" placeholder="AIzaSy..." class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-white outline-none focus:border-sky-400 font-mono">
        </div>

        <div class="space-y-1.5">
          <label class="text-slate-300 font-semibold flex items-center gap-1.5">
            <i class="fas fa-microchip text-sky-400"></i> Active Model
          </label>
          <select id="model-select" class="w-full px-3 py-2 rounded-lg bg-slate-950 border border-slate-800 text-white outline-none focus:border-sky-400">
            <option value="gemini-2.0-flash">Gemini 2.0 Flash (Fastest & Best for Coding)</option>
            <option value="gemini-2.0-flash">Gemini 2.0 Flash (Default)</option>
            <option value="gemini-2.0-flash">Gemini 2.0 Flash (High Speed)</option>
          </select>
        </div>

        <div class="space-y-2 pt-2 border-t border-slate-800">
          <label class="text-slate-400 font-semibold uppercase text-[10px] tracking-wider">Chat Backup</label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="exportChatMemory()" class="py-2 px-3 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 flex items-center justify-center gap-1.5">
              <i class="fas fa-download text-[10px] text-sky-400"></i> Backup JSON
            </button>
            <label class="py-2 px-3 rounded-lg bg-slate-900 border border-slate-800 text-slate-300 flex items-center justify-center gap-1.5 cursor-pointer">
              <i class="fas fa-upload text-[10px] text-sky-400"></i> Restore JSON
              <input type="file" id="import-memory-input" accept=".json" class="hidden" onchange="importChatMemory(event)">
            </label>
          </div>
        </div>

        <div class="pt-2 border-t border-slate-800">
          <button onclick="wipeAllData()" class="w-full py-2 px-3 rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 hover:bg-red-500/20 text-xs transition flex items-center justify-center gap-1.5">
            <i class="fas fa-trash-alt text-[11px]"></i> Clear All Sessions
          </button>
        </div>
      </div>

      <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
        <button onclick="closeSettingsModal()" class="px-4 py-2 text-slate-400 hover:text-white text-xs">Close</button>
        <button onclick="saveAllSettings()" class="px-5 py-2 bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-xs rounded-lg transition">Save</button>
      </div>
    </div>
  </div>

  <script>
    let chats = JSON.parse(localStorage.getItem('nexus_chats') || '[]');
    let currentChatId = localStorage.getItem('nexus_current_chat') || null;
    let currentImageBase64 = null;
    let currentMimeType = null;
    let isProcessing = false;
    let supabaseClient = null;
    let currentUser = null;
    let currentAuthMode = 'login';

    async function initSupabaseFromBackend() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();
        if (config.supabaseUrl && config.supabaseAnonKey && window.supabase) {
          supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
          
          supabaseClient.auth.onAuthStateChange((event, session) => {
            currentUser = session?.user || null;
            updateProfileDock();
            if (event === 'SIGNED_IN' && !localStorage.getItem('nexus_onboarded')) {
              openPersonalizeModal();
            }
          });

          const { data: { session } } = await supabaseClient.auth.getSession();
          currentUser = session?.user || null;
          updateProfileDock();
        } else {
          updateProfileDock();
        }
      } catch (e) {
        updateProfileDock();
      }
    }

    function updateProfileDock() {
      const dock = document.getElementById('user-profile-dock');
      const savedProfile = JSON.parse(localStorage.getItem('nexus_user_profile') || '{}');

      if (currentUser || savedProfile.name) {
        const name = savedProfile.name || currentUser?.user_metadata?.full_name || currentUser?.email?.split('@')[0] || 'Developer';
        const email = currentUser?.email || 'Active Workspace';
        const initial = name.charAt(0).toUpperCase();

        dock.innerHTML = `
          <div class="flex items-center justify-between p-2 rounded-xl hover:bg-slate-900/80 transition cursor-pointer" onclick="openPersonalizeModal()">
            <div class="flex items-center gap-2.5 truncate">
              <div class="w-8 h-8 rounded-full bg-sky-500/20 border border-sky-400 text-sky-400 flex items-center justify-center font-bold text-xs flex-shrink-0">
                ${initial}
              </div>
              <div class="truncate">
                <div class="text-xs font-semibold text-white flex items-center gap-1.5 truncate">
                  <span>${name}</span>
                  <span class="text-[9px] px-1 py-0.2 rounded bg-sky-500/20 text-sky-300 border border-sky-500/30 uppercase font-mono">DEV</span>
                </div>
                <span class="text-[10px] text-slate-500 truncate block">${email}</span>
              </div>
            </div>
            <div class="flex items-center gap-1">
              ${currentUser ? `<button onclick="event.stopPropagation(); signOut()" title="Logout" class="text-slate-500 hover:text-red-400 p-1.5"><i class="fas fa-sign-out-alt text-xs"></i></button>` : ''}
              <button onclick="event.stopPropagation(); openSettingsModal()" class="text-slate-400 hover:text-white p-1.5"><i class="fas fa-cog text-xs"></i></button>
            </div>
          </div>
        `;
      } else {
        dock.innerHTML = `
          <div class="flex items-center justify-between p-2 rounded-xl bg-slate-900/50 border border-slate-800">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 flex items-center justify-center text-xs">
                <i class="fas fa-user"></i>
              </div>
              <div>
                <div class="text-xs font-semibold text-white">Guest User</div>
                <button onclick="openAuthModal()" class="text-[10px] text-sky-400 hover:underline">Sign In / Register</button>
              </div>
            </div>
            <button onclick="openSettingsModal()" class="text-slate-400 hover:text-white p-1.5">
              <i class="fas fa-cog text-xs"></i>
            </button>
          </div>
        `;
      }
    }

    function openAuthModal() { 
      document.getElementById('auth-modal').classList.remove('hidden'); 
      switchAuthTab('login');
    }
    function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }

    function switchAuthTab(mode) {
      currentAuthMode = mode;
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const nameGroup = document.getElementById('name-field-group');
      const submitBtn = document.getElementById('auth-submit-btn');
      const title = document.getElementById('auth-title');
      const errorDiv = document.getElementById('auth-error-msg');
      errorDiv.classList.add('hidden');

      if (mode === 'login') {
        tabLogin.className = "flex-1 py-1.5 rounded-md font-semibold text-sky-400 bg-slate-800/80 transition";
        tabRegister.className = "flex-1 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition";
        nameGroup.classList.add('hidden');
        submitBtn.textContent = "Sign In";
        title.textContent = "Sign In to NexusCode";
      } else {
        tabRegister.className = "flex-1 py-1.5 rounded-md font-semibold text-sky-400 bg-slate-800/80 transition";
        tabLogin.className = "flex-1 py-1.5 rounded-md font-medium text-slate-400 hover:text-white transition";
        nameGroup.classList.remove('hidden');
        submitBtn.textContent = "Create Account";
        title.textContent = "Register for NexusCode";
      }
    }

    async function handleEmailAuth(e) {
      e.preventDefault();
      if (!supabaseClient) {
        alert("Connecting to Supabase... Please ensure keys are in Vercel.");
        return;
      }

      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      const name = document.getElementById('auth-name').value.trim();
      const errorDiv = document.getElementById('auth-error-msg');
      const submitBtn = document.getElementById('auth-submit-btn');

      errorDiv.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Processing...';

      try {
        if (currentAuthMode === 'register') {
          const { data, error } = await supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: { data: { full_name: name || 'Developer' } }
          });
          if (error) throw error;
          if (name) {
            const p = JSON.parse(localStorage.getItem('nexus_user_profile') || '{}');
            p.name = name;
            localStorage.setItem('nexus_user_profile', JSON.stringify(p));
          }
          if (data.session) {
            currentUser = data.user;
            closeAuthModal();
            updateProfileDock();
            openPersonalizeModal();
          } else {
            errorDiv.className = "text-[11px] text-emerald-400 bg-emerald-500/10 p-2.5 rounded-lg border border-emerald-500/20";
            errorDiv.textContent = "Registration successful! You can now log in.";
            errorDiv.classList.remove('hidden');
            setTimeout(() => switchAuthTab('login'), 1500);
          }
        } else {
          const { data, error } = await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });
          if (error) throw error;
          currentUser = data.user;
          closeAuthModal();
          updateProfileDock();
        }
      } catch (err) {
        errorDiv.className = "text-[11px] text-red-400 bg-red-500/10 p-2 rounded-lg border border-red-500/20";
        errorDiv.textContent = err.message || "Authentication error.";
        errorDiv.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = currentAuthMode === 'login' ? 'Sign In' : 'Create Account';
      }
    }

    async function loginWithOAuth(provider) {
      if (!supabaseClient) {
        alert("Supabase initializing... Please ensure SUPABASE_URL and SUPABASE_ANON_KEY are in Vercel.");
        return;
      }
      try {
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: provider,
          options: { redirectTo: window.location.origin + "/chat.html" }
        });
        if (error) alert("GitHub OAuth Error: " + error.message);
      } catch (err) {
        alert("Authentication failed: " + err.message);
      }
    }

    async function signOut() {
      if (supabaseClient) await supabaseClient.auth.signOut();
      currentUser = null;
      localStorage.removeItem('nexus_onboarded');
      localStorage.removeItem('nexus_user_profile');
      updateProfileDock();
    }

    function openPersonalizeModal() {
      const p = JSON.parse(localStorage.getItem('nexus_user_profile') || '{}');
      document.getElementById('user-display-name').value = p.name || currentUser?.user_metadata?.full_name || '';
      document.getElementById('user-tech-stack').value = p.stack || '';
      document.getElementById('user-custom-instructions').value = p.instructions || '';
      document.getElementById('personalize-modal').classList.remove('hidden');
    }

    function closePersonalizeModal() { document.getElementById('personalize-modal').classList.add('hidden'); }

    function saveUserProfile() {
      const name = document.getElementById('user-display-name').value.trim() || 'Developer';
      const stack = document.getElementById('user-tech-stack').value.trim();
      const instructions = document.getElementById('user-custom-instructions').value.trim();

      localStorage.setItem('nexus_user_profile', JSON.stringify({ name, stack, instructions }));
      localStorage.setItem('nexus_onboarded', 'true');
      updateProfileDock();
      closePersonalizeModal();
    }

    function safeMarkdown(text) {
      if (!text) return '';
      let raw = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      raw = raw.replace(/```([a-zA-Z0-9_\-\+\#]*)\n([\s\S]*?)```/g, function(match, lang, code) {
        return `<pre><div class="flex justify-between text-[11px] text-slate-400 border-b border-slate-800 pb-1 mb-2 font-mono"><span>${lang || 'code'}</span><button onclick="copySnippet(this)" class="hover:text-sky-400 transition flex items-center gap-1"><i class="far fa-copy text-[10px]"></i> Copy</button></div><code>${code.trim()}</code></pre>`;
      });
      raw = raw.replace(/`([^`]+)`/g, '<code class="bg-slate-800 text-sky-300 px-1.5 py-0.5 rounded text-xs">$1</code>');
      raw = raw.replace(/\*\*([^*]+)\*\*/g, '<strong class="text-white font-semibold">$1</strong>');
      raw = raw.replace(/^\* (.*$)/gim, '<li class="ml-4 list-disc text-slate-300">$1</li>');
      raw = raw.replace(/^- (.*$)/gim, '<li class="ml-4 list-disc text-slate-300">$1</li>');
      return '<div class="space-y-2 text-slate-300 leading-relaxed">' + raw.replace(/\n\n/g, '<br><br>') + '</div>';
    }

    function copySnippet(btn) {
      const code = btn.closest('pre').querySelector('code')?.innerText || '';
      navigator.clipboard.writeText(code);
      btn.innerHTML = '<i class="fas fa-check text-emerald-400 text-[10px]"></i> Copied!';
      setTimeout(() => { btn.innerHTML = '<i class="far fa-copy text-[10px]"></i> Copy'; }, 2000);
    }

    function saveChats() {
      if (chats.length > 50) chats = chats.slice(0, 50);
      localStorage.setItem('nexus_chats', JSON.stringify(chats));
      if (currentChatId) localStorage.setItem('nexus_current_chat', currentChatId);
    }

    function getActiveChat() {
      let chat = chats.find(c => c.id === currentChatId);
      if (!chat) {
        if (chats.length > 0) {
          chat = chats[0];
          currentChatId = chat.id;
        } else {
          chat = { id: Date.now().toString(), title: 'New Coding Session', messages: [] };
          chats.unshift(chat);
          currentChatId = chat.id;
        }
        saveChats();
      }
      return chat;
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('backdrop').classList.toggle('hidden');
    }

    function openSettingsModal() {
      document.getElementById('settings-key-input').value = localStorage.getItem('nexus_gemini_key') || '';
      document.getElementById('model-select').value = localStorage.getItem('nexus_model') || 'gemini-2.0-flash';
      document.getElementById('settings-modal').classList.remove('hidden');
    }
    function closeSettingsModal() { document.getElementById('settings-modal').classList.add('hidden'); }

    function saveAllSettings() {
      const key = document.getElementById('settings-key-input').value.trim();
      const model = document.getElementById('model-select').value;
      if (key) localStorage.setItem('nexus_gemini_key', key);
      localStorage.setItem('nexus_model', model);
      closeSettingsModal();
    }

    function filterChats() {
      const query = document.getElementById('search-input').value.toLowerCase();
      renderHistory(query);
    }

    function exportChatMemory() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(chats, null, 2));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `nexus_chats_backup_${Date.now()}.json`);
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function importChatMemory(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const imported = JSON.parse(evt.target.result);
          if (Array.isArray(imported)) {
            chats = imported;
            saveChats();
            currentChatId = chats[0]?.id || null;
            renderHistory();
            renderAllMessages();
            alert("Memory successfully restored!");
            closeSettingsModal();
          }
        } catch(err) { alert("Invalid JSON file."); }
      };
      reader.readAsText(file);
    }

    function wipeAllData() {
      if (confirm("Clear all chat sessions?")) {
        chats = [];
        localStorage.removeItem('nexus_chats');
        createNewChat();
        closeSettingsModal();
      }
    }

    function handleImageSelection(e) {
      const file = e.target.files[0];
      if (!file) return;
      currentMimeType = file.type;
      const reader = new FileReader();
      reader.onload = function(evt) {
        currentImageBase64 = evt.target.result;
        document.getElementById('image-preview').src = currentImageBase64;
        document.getElementById('image-name').textContent = file.name;
        document.getElementById('image-preview-container').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removeAttachedImage() {
      currentImageBase64 = null;
      currentMimeType = null;
      document.getElementById('media-input').value = '';
      document.getElementById('image-preview-container').classList.add('hidden');
    }

    function createNewChat() {
      const newChat = { id: Date.now().toString(), title: 'New Coding Session', messages: [] };
      chats.unshift(newChat);
      currentChatId = newChat.id;
      saveChats();
      renderHistory();
      renderAllMessages();
      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('backdrop').classList.add('hidden');
      }
    }

    function renderHistory(filter = '') {
      const list = document.getElementById('history-list');
      list.innerHTML = '';
      const visibleChats = filter ? chats.filter(c => c.title.toLowerCase().includes(filter)) : chats;

      visibleChats.forEach(chat => {
        const item = document.createElement('div');
        const isActive = chat.id === currentChatId;
        item.className = `group flex items-center justify-between p-2.5 rounded-xl cursor-pointer text-xs transition ${
          isActive ? 'bg-sky-500/15 text-sky-300 border border-sky-500/30' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200'
        }`;
        item.innerHTML = `
          <div class="flex items-center gap-2 truncate flex-1" onclick="switchChat('${chat.id}')">
            <i class="fas fa-terminal text-[10px] text-sky-400"></i>
            <span class="truncate">${chat.title}</span>
          </div>
          <button onclick="deleteChat(event, '${chat.id}')" class="opacity-0 group-hover:opacity-100 text-slate-500 hover:text-red-400 p-1">
            <i class="fas fa-trash-alt text-[10px]"></i>
          </button>
        `;
        list.appendChild(item);
      });
    }

    function switchChat(id) {
      currentChatId = id;
      saveChats();
      renderHistory();
      renderAllMessages();
      if (window.innerWidth < 768) {
        document.getElementById('sidebar').classList.add('-translate-x-full');
        document.getElementById('backdrop').classList.add('hidden');
      }
    }

    function deleteChat(e, id) {
      e.stopPropagation();
      chats = chats.filter(c => c.id !== id);
      if (currentChatId === id) currentChatId = chats.length > 0 ? chats[0].id : null;
      saveChats();
      renderHistory();
      renderAllMessages();
    }

    function appendMessageElement(msg) {
      const container = document.getElementById('messages-container');
      const welcome = document.getElementById('welcome-state');
      if (welcome) welcome.classList.add('hidden');

      const wrap = document.createElement('div');
      wrap.className = `flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`;

      const box = document.createElement('div');
      box.className = `max-w-2xl sm:max-w-3xl rounded-2xl p-4 text-xs sm:text-sm ${
        msg.role === 'user'
          ? 'bg-sky-600 text-white rounded-tr-none shadow-md'
          : 'bg-slate-900 border border-slate-800 text-slate-200 rounded-tl-none'
      }`;

      let imgHtml = msg.image ? `<img src="${msg.image}" class="max-h-48 rounded-lg mb-3 border border-slate-700">` : '';

      let thoughtHtml = '';
      if (msg.role !== 'user' && msg.thought) {
        thoughtHtml = `
          <details class="mb-3 bg-slate-950/80 border border-slate-800 rounded-xl overflow-hidden group" open>
            <summary class="cursor-pointer px-3.5 py-2 text-xs text-sky-400 font-mono font-medium flex items-center justify-between hover:bg-slate-900/60 select-none">
              <span class="flex items-center gap-2"><i class="fas fa-brain text-[11px]"></i> Reasoning & Thought Process</span>
              <span class="text-[10px] text-slate-500 group-open:rotate-180 transition-transform">▼</span>
            </summary>
            <div class="p-3 text-[11px] text-slate-400 font-mono border-t border-slate-800 whitespace-pre-wrap leading-relaxed bg-[#020611]">
              ${msg.thought.replace(/</g, '&lt;').replace(/>/g, '&gt;')}
            </div>
          </details>
        `;
      }

      const bodyHtml = msg.role === 'user' ? `<p class="whitespace-pre-wrap">${msg.content}</p>` : safeMarkdown(msg.content);
      box.innerHTML = imgHtml + thoughtHtml + bodyHtml;
      wrap.appendChild(box);
      container.appendChild(wrap);
      container.scrollTop = container.scrollHeight;
    }

    function renderAllMessages() {
      const container = document.getElementById('messages-container');
      const welcome = document.getElementById('welcome-state');
      const chat = getActiveChat();

      container.innerHTML = '';
      if (chat.messages.length === 0) {
        container.appendChild(welcome);
        welcome.classList.remove('hidden');
        document.getElementById('current-chat-title').textContent = 'New Session';
        return;
      }

      welcome.classList.add('hidden');
      document.getElementById('current-chat-title').textContent = chat.title;
      chat.messages.forEach(msg => appendMessageElement(msg));
    }

    async function sendMessage() {
      if (isProcessing) return;

      const promptInput = document.getElementById('prompt-input');
      const text = promptInput.value.trim();

      if (!text && !currentImageBase64) return;

      const apiKey = (localStorage.getItem('nexus_gemini_key') || '').trim();
      if (!apiKey) {
        openSettingsModal();
        return;
      }

      const activeChat = getActiveChat();
      const userMsg = { role: 'user', content: text, image: currentImageBase64 };

      activeChat.messages.push(userMsg);
      if (activeChat.messages.length === 1 && text) {
        activeChat.title = text.slice(0, 26) + '...';
        document.getElementById('current-chat-title').textContent = activeChat.title;
        renderHistory();
      }
      saveChats();

      appendMessageElement(userMsg);

      promptInput.value = '';
      promptInput.style.height = 'auto';
      let imgBase64Payload = currentImageBase64 ? currentImageBase64.split(',')[1] : null;
      let mimeTypePayload = currentMimeType;
      removeAttachedImage();

      isProcessing = true;
      document.getElementById('send-icon').className = 'fas fa-spinner fa-spin text-xs';

      const container = document.getElementById('messages-container');
      const loader = document.createElement('div');
      loader.id = 'live-thinking-card';
      loader.className = 'flex justify-start';
      loader.innerHTML = `
        <div class="bg-slate-900 border border-sky-500/40 p-4 rounded-2xl text-xs space-y-2.5 max-w-sm shadow-xl">
          <div class="flex items-center justify-between text-sky-400 font-semibold">
            <span class="flex items-center gap-2"><i class="fas fa-brain animate-pulse"></i> Generating Full Code...</span>
            <span id="think-timer" class="font-mono text-slate-400 text-[11px]">0.0s</span>
          </div>
          <div class="h-1 bg-slate-800 rounded-full overflow-hidden">
            <div class="h-full bg-sky-500 rounded-full animate-pulse w-4/5"></div>
          </div>
          <div id="think-phase" class="text-[11px] text-slate-400 font-mono">Writing complete HTML, CSS, JavaScript logic...</div>
        </div>`;
      container.appendChild(loader);
      container.scrollTop = container.scrollHeight;

      let startTime = Date.now();
      const timerInterval = setInterval(() => {
        const timerElem = document.getElementById('think-timer');
        if (timerElem) timerElem.textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
      }, 100);

      // System Prompt Setup
      const profile = JSON.parse(localStorage.getItem('nexus_user_profile') || '{}');
      let systemInstruction = "You are NexusCode AI, an elite programmer and software engineer. Always provide complete, production-ready, fully functional code with complete HTML, CSS, and JavaScript. Never truncate code or use placeholders like '// add remaining code here'. Structure cleanly with markdown code blocks.";

      if (profile.name) systemInstruction += `\nUser Developer: ${profile.name}.`;
      if (profile.stack) systemInstruction += `\nPreferred Stack: ${profile.stack}.`;
      if (profile.instructions) systemInstruction += `\nCustom Directive: ${profile.instructions}`;

      // Clean History Sanitizer (FILTER OUT ALL ERROR MESSAGES)
      const sanitizedHistory = [];
      const rawHistory = activeChat.messages.filter(m => !m.content.startsWith('⚠️'));

      // Ensure proper user -> model sequence starting with user
      let lastRole = null;
      for (const m of rawHistory.slice(-8)) {
        if (m.role === lastRole) continue;
        if (sanitizedHistory.length === 0 && m.role !== 'user') continue;
        sanitizedHistory.push(m);
        lastRole = m.role;
      }

      // Build valid Gemini contents
      const contentsPayload = [];
      sanitizedHistory.forEach((m, idx) => {
        const parts = [];
        if (m.image && idx === sanitizedHistory.length - 1) {
          parts.push({
            inlineData: { mimeType: mimeTypePayload, data: imgBase64Payload }
          });
        }
        parts.push({ text: m.content });
        contentsPayload.push({
          role: m.role === 'user' ? 'user' : 'model',
          parts: parts
        });
      });

      // Rock-Solid Model Cascade: 2.0 Flash (Fastest) -> 1.5 Flash -> 1.5 Pro
      const selectedModel = localStorage.getItem('nexus_model') || 'gemini-2.0-flash';
      const modelsToTry = [selectedModel, 'gemini-2.0-flash', 'gemini-2.0-flash', 'gemini-2.0-flash'].filter((v, i, a) => a.indexOf(v) === i);

      try {
        let extractedReply = null;
        let extractedThoughts = "";
        let finalError = null;

        for (const model of modelsToTry) {
          try {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                systemInstruction: { parts: [{ text: systemInstruction }] },
                contents: contentsPayload,
                generationConfig: {
                  temperature: 0.4,
                  maxOutputTokens: 8192
                }
              })
            });

            const json = await res.json();
            if (json.candidates && json.candidates[0]?.content?.parts) {
              const resParts = json.candidates[0].content.parts;
              resParts.forEach(p => {
                if (p.thought) extractedThoughts += (p.text || "") + "\n";
                else if (p.text) extractedReply = (extractedReply || "") + p.text;
              });
              if (extractedReply || extractedThoughts) break;
            } else if (json.error) {
              finalError = json.error.message || JSON.stringify(json.error);
            }
          } catch(e) { finalError = e.message; }
        }

        clearInterval(timerInterval);
        document.getElementById('live-thinking-card')?.remove();

        const modelMsg = {
          role: 'model',
          content: extractedReply || extractedThoughts || `⚠️ API Notice: ${finalError || 'Unable to generate code.'}`,
          thought: extractedReply ? extractedThoughts.trim() : ""
        };

        activeChat.messages.push(modelMsg);
        saveChats();
        appendMessageElement(modelMsg);

      } catch (err) {
        clearInterval(timerInterval);
        document.getElementById('live-thinking-card')?.remove();
        const errorMsg = { role: 'model', content: "⚠️ Network Exception: " + err.message, thought: "" };
        activeChat.messages.push(errorMsg);
        saveChats();
        appendMessageElement(errorMsg);
      } finally {
        isProcessing = false;
        document.getElementById('send-icon').className = 'fas fa-arrow-up text-xs';
      }
    }

    function clearCurrentChat() {
      const chat = getActiveChat();
      chat.messages = [];
      saveChats();
      renderAllMessages();
    }

    const textarea = document.getElementById('prompt-input');
    textarea.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = (this.scrollHeight) + 'px';
    });
    textarea.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    initSupabaseFromBackend(); const params = new URLSearchParams(window.location.search); if (params.get("openAuth") === "true") { setTimeout(openAuthModal, 400); }
    getActiveChat();
    renderHistory();
    renderAllMessages();
  </script>
</body>
</html>
